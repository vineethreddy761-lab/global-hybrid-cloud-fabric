---
- name: Configure and Harden Hybrid Infrastructure Nodes
  hosts: all
  become: yes
  vars:
    app_user: "betting_admin"
    required_packages:
      - curl
      - git
      - ufw
      - fail2ban
      - postgresql-client

  tasks:
    - name: Update apt package cache
      apt:
      args:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install core administrative and security packages
      apt:
        name: "{{ required_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure UFW firewall is enabled and default policies are set
      ufw:
        state: enabled
        policy: deny
      tags: security

    - name: Allow SSH through firewall
      ufw:
        rule: allow
        port: '22'
        proto: tcp
      tags: security

    - name: Create dedicated application service user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Configure secure system kernel parameters for high throughput
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: 'net.core.somaxconn', value: '1024' }
        - { key: 'net.ipv4.tcp_max_syn_backlog', value: '2048' }
      tags: performance
