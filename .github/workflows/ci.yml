name: Hybrid Cloud CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python Syntax and Scripts
        run: |
          python3 -m py_compile scripts/*.py
          echo "All Python automation scripts compiled successfully."
